<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn English</title>
<link rel="stylesheet" href="style.css">
<script src="menuLoader"></script>
</head>


<!-- Кнопка меню -->
<button class="menu__btn" id="menuBtn">☰ Меню</button>
<ul class="menu__nav" id="menuDropdown">
  <!-- Кнопка «Мой словарь» -->
  <li class="menu__nav-item">
    <button class="level-btn" id="myDictionaryBtn">Мой словарь</button>
  </li>
</ul>

<div id="lessonContent">
  <div id="progressText"></div>
  <div id="progressBarContainer">
    <div id="progressBar">0%</div>
  </div>

  <!-- Страница 0: самостоятельный ввод слов -->
  <div id="page0">
    <h2>Введите английские слова (по одному на строку)</h2>
    <textarea id="englishWords" rows="8" placeholder="cat&#10;dog&#10;pig"></textarea><br>
    <button onclick="goToTranscription()">Дальше</button>
  </div>

  <!-- Страница 1: транскрипции -->
  <div id="page1_5" class="hidden">
    <h2>Введите транскрипции (можно пропустить)</h2>
    <textarea id="englishTranscription" rows="8" placeholder="kæt&#10;dɒg&#10;pɪg"></textarea><br>
    <button onclick="skipTranscription()">Пропустить</button>
    <button onclick="goToTranslations()">Дальше</button>
  </div>

  <!-- Страница 2: переводы -->
  <div id="page2" class="hidden">
    <h2>Введите переводы (по одному на строку)</h2>
    <textarea id="translatedWords" rows="8" placeholder="кот&#10;собака&#10;свинья"></textarea><br>
    <button onclick="startSelfLearning()">Начать обучение</button>
  </div>

  <!-- Фазы обучения -->
  <div id="page3" class="hidden">
    <h2>Фаза 1: Ознакомление</h2>
    <p id="card">
      <span id="cardWord"></span>
      <button id="addToDictionaryBtn" class="dictionary-btn">☆</button>
    </p>
    <div class="example" id="cardExample"></div>
    <button onclick="showNextCard()">Далее</button>
    <button onclick="repeatPhase()">Повторить этап</button>
    <button onclick="goToNextPage()">Пропустить этап</button>
  </div>

  <div id="page4" class="hidden">
    <h2>Фаза 2: Перевод → Оригинал</h2>
    <p id="phase2-translation">
      <span id="phase2Word"></span>
      <button id="addToDictionaryBtn2" class="dictionary-btn">☆</button>
    </p>
    <div class="example" id="phase2-example"></div>
    <button id="showAnswerBtn" onclick="showAnswer()">Показать ответ</button>
    <div id="answerSection" class="hidden">
      <p id="phase2-answer"></p>
      <button onclick="markAnswer(true)">✅</button>
      <button onclick="markAnswer(false)">❌</button>
      <button onclick="repeatPhase()">Повторить этап</button>
      <button onclick="goToNextPage()">Пропустить этап</button>
    </div>
  </div>

  <div id="page5" class="hidden">
    <h2>Фаза 3: Оригинал → Перевод</h2>
    <p id="phase3-original">
      <span id="phase3Word"></span>
      <button id="addToDictionaryBtn3" class="dictionary-btn">☆</button>
    </p>
    <div class="example" id="phase3-example"></div>
    <button id="showAnswerBtn3" onclick="showAnswer3()">Показать ответ</button>
    <div id="answerSection3" class="hidden">
      <p id="phase3-answer"></p>
      <button onclick="markAnswer3(true)">✅</button>
      <button onclick="markAnswer3(false)">❌</button>
      <button onclick="repeatPhase()">Повторить этап</button>
      <button onclick="goToNextPage()">Пропустить этап</button>
    </div>
  </div>

  <div id="page6" class="hidden">
    <h2>Фаза 4: Диктант</h2>
    <p id="dictation-translation"></p>
    <div class="example" id="dictation-example"></div>
    <input type="text" id="dictation-input" placeholder="Введите английское слово" autocomplete="off">
    <button onclick="checkDictation()">Проверить</button>
    <button onclick="nextDictationAfterError()">Следующее</button>
    <p id="dictation-feedback"></p>
  </div>

  <div id="finishPage" class="hidden">
    <h2>🎉 Урок завершён!</h2>
    <button onclick="backToMenu()">Вернуться к меню</button>
  </div>
</div>

<script>

  // === Глобальные переменные === 
let lessonsDB = {};
let currentLesson = null;
let currentLessonElement = null;
let words = [];
let transcriptions = [];
let translations = [];
let examples = [];
let currentPhase = 0;
let currentIndex = 0;
let wrongQueue = [];
let dictationQueue = [];
let dictationWaiting = false;
let pullExamplesFromJSON = true; // подтягивать примеры из JSON
let lastSpokenWord = "";
let slowMode = false;

// === LocalStorage: словарь и завершённые уроки ===
const LOCAL_STORAGE_KEY = "myDictionary";
const FINISHED_LESSONS_KEY = "finishedLessons";

function getMyDictionary() {
  const dict = localStorage.getItem(LOCAL_STORAGE_KEY);
  return dict ? JSON.parse(dict) : [];
}

function saveMyDictionary(dict) {
  localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(dict));
}

function getFinishedLessons() {
  const finished = localStorage.getItem(FINISHED_LESSONS_KEY);
  return finished ? JSON.parse(finished) : {};
}

function saveFinishedLesson(level, lessonKey) {
  const finished = getFinishedLessons();
  if (!finished[level]) finished[level] = [];
  if (!finished[level].includes(lessonKey)) finished[level].push(lessonKey);
  localStorage.setItem(FINISHED_LESSONS_KEY, JSON.stringify(finished));
}

// === Проверка словаря ===
function isInDictionary(word) {
  return getMyDictionary().includes(word);
}

function toggleDictionary(word, button) {
  let dict = getMyDictionary();
  if (dict.includes(word)) {
    dict = dict.filter(w => w !== word);
    button.textContent = "☆";
  } else {
    dict.push(word);
    button.textContent = "★";
  }
  saveMyDictionary(dict);
}

// === Озвучка ===
function speakWord(word) {
  if (!word) return;
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = "en-US";
  utter.rate = slowMode ? 0.7 : 1.0;
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
  slowMode = (lastSpokenWord === word) ? !slowMode : false;
  lastSpokenWord = word;
}

// === Загружаем JSON ===
fetch("lessons.json")
  .then(res => res.json())
  .then(data => {
    lessonsDB = data;
    generateLevelsMenu();
    addSettingsMenu();
  })
  .catch(err => console.error("Ошибка загрузки JSON:", err));

// === Меню ===
document.getElementById("menuBtn").addEventListener("click", () => {
  document.getElementById("menuDropdown").classList.toggle("show");
});

// === Генерация уровней и уроков ===
function generateLevelsMenu() {
  const menu = document.getElementById("menuDropdown");
  menu.innerHTML = "";
  const finished = getFinishedLessons();

  Object.keys(lessonsDB).forEach(level => {
    const li = document.createElement("li");
    li.classList.add("menu__nav-item");

    const btn = document.createElement("button");
    btn.textContent = level;
    btn.classList.add("level-btn");
    li.appendChild(btn);

    const ul = document.createElement("ul");
    ul.classList.add("submenu");
    ul.style.display = "none";

    Object.keys(lessonsDB[level]).forEach(lessonKey => {
      const lessonLi = document.createElement("li");
      lessonLi.textContent = lessonsDB[level][lessonKey].title;
      lessonLi.style.cursor = "pointer";

      if (finished[level] && finished[level].includes(lessonKey)) {
        lessonLi.style.backgroundColor = "#6fcf97";
        lessonLi.style.color = "#000";
      }

      lessonLi.addEventListener("click", () => {
        startLesson(level, lessonKey);

        if (currentLessonElement) {
          currentLessonElement.style.backgroundColor = "";
          currentLessonElement.style.color = "";
        }
        lessonLi.style.backgroundColor = "#ffd966";
        lessonLi.style.color = "#000";
        currentLessonElement = lessonLi;

        setTimeout(() => {
          document.getElementById("page3").scrollIntoView({ behavior: "smooth", block: "start" });
        }, 300);
      });

      ul.appendChild(lessonLi);
    });

    li.appendChild(ul);
    menu.appendChild(li);

    btn.addEventListener("click", () => {
      const isShown = ul.style.display === "block";
      document.querySelectorAll(".submenu").forEach(sub => sub.style.display = "none");
      ul.style.display = isShown ? "none" : "block";
    });
  });

  const dictBtn = document.createElement("li");
  dictBtn.innerHTML = `<button id="myDictionaryBtn">★ Мой словарь</button>`;
  menu.appendChild(dictBtn);
  document.getElementById("myDictionaryBtn").addEventListener("click", startDictionaryLesson);
}

// === Настройки ===
function addSettingsMenu() {
  const menu = document.getElementById("menuDropdown");

  const settingsLi = document.createElement("li");
  settingsLi.classList.add("menu__nav-item");

  const settingsBtn = document.createElement("button");
  settingsBtn.textContent = "⚙ Настройки";
  settingsBtn.classList.add("level-btn");
  settingsLi.appendChild(settingsBtn);

  const settingsSubmenu = document.createElement("ul");
  settingsSubmenu.classList.add("submenu");
  settingsSubmenu.style.display = "none";

  const resetExamplesLi = document.createElement("li");
  const resetBtn = document.createElement("button");
  resetBtn.textContent = "Сброс примеров";
  resetBtn.style.cursor = "pointer";
  resetBtn.onclick = () => {
    pullExamplesFromJSON = false;
    examples = words.map(() => "");
    alert("Примеры больше не подтягиваются из JSON!");
  };
  resetExamplesLi.appendChild(resetBtn);
  settingsSubmenu.appendChild(resetExamplesLi);

  settingsLi.appendChild(settingsSubmenu);
  menu.appendChild(settingsLi);

  settingsBtn.addEventListener("click", () => {
    const isShown = settingsSubmenu.style.display === "block";
    document.querySelectorAll(".submenu").forEach(sub => sub.style.display = "none");
    settingsSubmenu.style.display = isShown ? "none" : "block";
  });
}

// === Запуск урока из JSON ===
function startLesson(level, lessonKey) {
  const lesson = lessonsDB[level][lessonKey];
  if (!lesson) return;

  currentLesson = { level, lessonKey };
  words = lesson.english;
  transcriptions = lesson.transcriptions;
  translations = lesson.translated;
  examples = pullExamplesFromJSON ? (lesson.example || []) : words.map(() => "");
  currentPhase = 3;
  currentIndex = 0;
  wrongQueue = [];
  startPhase(currentPhase);
  document.getElementById("menuDropdown").classList.remove("show");
}

// === Запуск урока из словаря ===
function startDictionaryLesson() {
  const dict = getMyDictionary();
  if (dict.length === 0) { alert("Ваш словарь пуст."); return; }

  let foundWords = [], foundTrans = [], foundTransl = [], foundExamples = [];
  for (const word of dict) {
    let found = false;
    for (const levelKey in lessonsDB) {
      for (const lessonKey in lessonsDB[levelKey]) {
        const lesson = lessonsDB[levelKey][lessonKey];
        const idx = lesson.english.indexOf(word);
        if (idx !== -1) {
          foundWords.push(lesson.english[idx]);
          foundTrans.push(lesson.transcriptions[idx] || "");
          foundTransl.push(lesson.translated[idx] || "(перевод)");
          foundExamples.push(lesson.example ? lesson.example[idx] : "");
          found = true;
          break;
        }
      }
      if (found) break;
    }
    if (!found) {
      foundWords.push(word);
      foundTrans.push("");
      foundTransl.push("(не найдено)");
      foundExamples.push("");
    }
  }

  words = foundWords;
  transcriptions = foundTrans;
  translations = foundTransl;
  examples = foundExamples;
  currentPhase = 3;
  currentIndex = 0;
  wrongQueue = [];
  hideAllPages();
  startPhase(currentPhase);
  document.getElementById("menuDropdown").classList.remove("show");
}

// === Самостоятельный ввод слов ===
function goToTranscription() {
  const rawWords = document.getElementById("englishWords").value.trim();
  if (!rawWords) { alert("Введите хотя бы одно слово"); return; }
  words = rawWords.split("\n").map(s => s.trim());
  transcriptions = words.map(() => "");
  translations = words.map(() => "");
  examples = words.map(() => "");
  hideAllPages();
  document.getElementById("page1_5").classList.remove("hidden");
}

function skipTranscription() {
  transcriptions = words.map(() => "");
  goToTranslations();
}

function goToTranslations() {
  const rawTrans = document.getElementById("englishTranscription").value.trim();
  if (rawTrans) {
    transcriptions = rawTrans.split("\n").map(s => s.trim());
    if (transcriptions.length !== words.length) { alert("Количество транскрипций должно совпадать с количеством слов"); return; }
  } else transcriptions = words.map(() => "");
  hideAllPages();
  document.getElementById("page2").classList.remove("hidden");
}

function startSelfLearning() {
  const rawTransl = document.getElementById("translatedWords").value.trim();
  if (!rawTransl) { alert("Введите переводы"); return; }
  translations = rawTransl.split("\n").map(s => s.trim());
  if (translations.length !== words.length) { alert("Количество переводов должно совпадать с количеством слов"); return; }
  examples = words.map(() => "");
  currentPhase = 3;
  currentIndex = 0;
  wrongQueue = [];
  hideAllPages();
  startPhase(currentPhase);
}

// === Управление страницами ===
function hideAllPages() {
  ["page0","page1_5","page2","page3","page4","page5","page6","finishPage"].forEach(id =>
    document.getElementById(id).classList.add("hidden")
  );
}

// === Фазы ===
function startPhase(phase) {
  hideAllPages();
  currentPhase = phase;
  currentIndex = 0;
  wrongQueue = [];
  updateProgress();

  if (phase === 3) showNextCard();
  if (phase === 4) showPhase2();
  if (phase === 5) showPhase3();
  if (phase === 6) startDictationPhase();
}

// === Прогресс ===
function updateProgress() {
  const total = words.length;
  const done = currentIndex;
  const percent = Math.min(100, Math.round((done / total) * 100));
  document.getElementById("progressText").textContent = `Прогресс: ${done}/${total}`;
  document.getElementById("progressBar").style.width = percent + "%";
  document.getElementById("progressBar").textContent = percent + "%";
}

// === Фаза 3 (карточки) ===
function showNextCard() {
  if (currentIndex >= words.length) { goToNextPage(); return; }
  document.getElementById("page3").classList.remove("hidden");
  const word = words[currentIndex];
  document.getElementById("card").innerHTML =
    `<strong>${word}</strong> [${transcriptions[currentIndex]}] — ${translations[currentIndex]}
     <button id="speakBtn">🔊</button>
     <button id="addToDictionaryBtn" class="dictionary-btn">${isInDictionary(word) ? "★" : "☆"}</button>`;
  document.getElementById("cardExample").textContent = examples[currentIndex] || "";

  document.getElementById("speakBtn").onclick = () => speakWord(word);
  document.getElementById("addToDictionaryBtn").onclick = () => toggleDictionary(word, document.getElementById("addToDictionaryBtn"));

  currentIndex++;
  updateProgress();
}

// === Фаза 4 ===
function showPhase2() {
  if (currentIndex >= words.length && wrongQueue.length === 0) { goToNextPage(); return; }
  document.getElementById("page4").classList.remove("hidden");
  document.getElementById("answerSection").classList.add("hidden");
  const i = getCurrentIndex();
  document.getElementById("phase2-translation").innerHTML = translations[i];
  document.getElementById("phase2-example").textContent = examples[i] || "";
}

function showAnswer() {
  const i = getCurrentIndex();
  const answerContainer = document.getElementById("answerSection");
  document.getElementById("phase2-answer").textContent = `${words[i]} [${transcriptions[i]}]`;
  answerContainer.classList.remove("hidden");

  let btn = document.getElementById("speakPhase4Btn");
  if (!btn) {
    btn = document.createElement("button");
    btn.id = "speakPhase4Btn";
    btn.textContent = "🔊";
    answerContainer.appendChild(btn);
  }
  btn.onclick = () => speakWord(words[i]);
}

function markAnswer(correct) {
  const i = getCurrentIndex();
  if (!correct) wrongQueue.push(i);
  nextIndex();
  showPhase2();
}

// === Фаза 5 ===
function showPhase3() {
  if (currentIndex >= words.length && wrongQueue.length === 0) { goToNextPage(); return; }
  document.getElementById("page5").classList.remove("hidden");
  document.getElementById("answerSection3").classList.add("hidden");
  const i = getCurrentIndex();
  document.getElementById("phase3-original").textContent = words[i];
  document.getElementById("phase3-example").textContent = examples[i] || "";
}

function showAnswer3() {
  const i = getCurrentIndex();
  const answerContainer = document.getElementById("answerSection3");
  document.getElementById("phase3-answer").textContent = translations[i];
  answerContainer.classList.remove("hidden");

  let btn = document.getElementById("speakPhase5Btn");
  if (!btn) {
    btn = document.createElement("button");
    btn.id = "speakPhase5Btn";
    btn.textContent = "🔊";
    answerContainer.appendChild(btn);
  }
  btn.onclick = () => speakWord(words[i]);
}

function markAnswer3(correct) {
  const i = getCurrentIndex();
  if (!correct) wrongQueue.push(i);
  nextIndex();
  showPhase3();
}

// === Общие функции ===
function nextIndex() {
  if (wrongQueue.length > 0) currentIndex = wrongQueue.shift();
  else currentIndex++;
  updateProgress();
}

function getCurrentIndex() {
  return (wrongQueue.length > 0) ? wrongQueue[0] : currentIndex;
}

function goToNextPage() {
  if (currentPhase === 3) startPhase(4);
  else if (currentPhase === 4) startPhase(5);
  else if (currentPhase === 5) startPhase(6);
  else finishLesson();
}

// === Повторить этап ===
function repeatPhase() {
  if (currentPhase > 3) startPhase(currentPhase - 1);
  else startPhase(3);
}

// === Финал урока ===
function finishLesson() {
  hideAllPages();
  document.getElementById("finishPage").classList.remove("hidden");
  if (currentLesson) saveFinishedLesson(currentLesson.level, currentLesson.lessonKey);
  generateLevelsMenu();
}

function backToMenu() {
  hideAllPages();
  document.getElementById("page0").classList.remove("hidden");
  document.getElementById("menuDropdown").classList.add("show");
}

// ===== Исправленный блок: Диктант (Фаза 6) =====

function startDictationPhase() {
  // создаём очередь индексов всех слов
  dictationQueue = words.map((_, i) => i);
  dictationWaiting = false;
  showNextDictationWord();
}

function showNextDictationWord() {
  if (!dictationQueue || dictationQueue.length === 0) {
    finishLesson();
    return;
  }

  // текущий индекс — первый в очереди
  currentIndex = dictationQueue[0];
  dictationWaiting = false;

  hideAllPages();
  const page = document.getElementById("page6");
  page.classList.remove("hidden");

  // показываем перевод и пример
  document.getElementById("dictation-translation").textContent = translations[currentIndex] || "";
  document.getElementById("dictation-example").textContent = examples[currentIndex] || "";

  // подготавливаем поле ввода и фидбек
  const inputEl = document.getElementById("dictation-input");
  inputEl.value = "";
  inputEl.focus();
  document.getElementById("dictation-feedback").textContent = "";

  // кнопка озвучки (создаём единожды)
  let btn = document.getElementById("speakDictationBtn");
  if (!btn) {
    btn = document.createElement("button");
    btn.id = "speakDictationBtn";
    btn.textContent = "🔊";
    // вставляем кнопку внутрь страницы диктанта (после input)
    page.appendChild(btn);
  }
  btn.onclick = () => speakWord(words[currentIndex]);
}

function checkDictation() {
  // если мы уже в состоянии «ожидание следующего после ошибки», игнорируем повторные нажатия
  if (dictationWaiting) return;

  // используем id из разметки: "dictation-input" и "dictation-feedback"
  const inputEl = document.getElementById("dictation-input");
  const userAnswer = (inputEl.value || "").trim();
  const correctWord = words[currentIndex] || "";

  if (!userAnswer) {
    document.getElementById("dictation-feedback").textContent = "Введите слово.";
    return;
  }

  if (userAnswer.toLowerCase() === correctWord.toLowerCase()) {
    // правильно — удаляем текущий элемент из очереди и переходим к следующему
    document.getElementById("dictation-feedback").textContent = "✅ Верно!";
    dictationQueue.shift();
    // лёгкая задержка, чтобы пользователь увидел фидбек
    setTimeout(showNextDictationWord, 500);
  } else {
    // неверно — показываем правильный ответ в поле ввода и перемещаем слово в конец очереди
    document.getElementById("dictation-feedback").textContent = `❌ Неверно. Слово будет повторено позже.`;
    inputEl.value = correctWord; // показываем правильный ответ в поле ввода
    // переместить текущую (первую) запись в конец очереди
    dictationQueue.push(dictationQueue.shift());
    dictationWaiting = true; // теперь ждём, пока пользователь нажмёт "Следующее"
  }
}

function nextDictationAfterError() {
  // кнопка "Следующее" активна только после ошибки (dictationWaiting === true)
  if (!dictationWaiting) return;
  showNextDictationWord();
}

// === Горячие клавиши ===
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    if (!document.getElementById("page3").classList.contains("hidden")) showNextCard();
    if (!document.getElementById("page4").classList.contains("hidden")) {
      if (document.getElementById("answerSection").classList.contains("hidden")) showAnswer();
      else markAnswer(true);
    }
    if (!document.getElementById("page5").classList.contains("hidden")) {
      if (document.getElementById("answerSection3").classList.contains("hidden")) showAnswer3();
      else markAnswer3(true);
    }
    if (!document.getElementById("page6").classList.contains("hidden")) checkDictation();
  }
  if (e.code === "Space") {
    if (!document.getElementById("page4").classList.contains("hidden")) showAnswer();
    if (!document.getElementById("page5").classList.contains("hidden")) showAnswer3();
  }
});
  // === Фаза 4 ===
function markAnswer(correct) {
  const i = currentIndex;
  if (!correct) {
    // добавляем в конец списка для повторного показа
    wrongQueue.push(i);
  }
  currentIndex++;
  // если дошли до конца основного списка, начинаем показывать неправильные
  if (currentIndex >= words.length && wrongQueue.length > 0) {
    currentIndex = wrongQueue.shift();
  }
  showPhase2();
}

// === Фаза 5 ===
function markAnswer3(correct) {
  const i = currentIndex;
  if (!correct) {
    wrongQueue.push(i);
  }
  currentIndex++;
  if (currentIndex >= words.length && wrongQueue.length > 0) {
    currentIndex = wrongQueue.shift();
  }
  showPhase3();
}
// === Фаза 4 ===
function markAnswer(correct) {
  if (!correct) {
    // Добавляем индекс текущего слова в конец очереди для повторного показа
    wrongQueue.push(currentIndex);
  }
  currentIndex++; // Идём дальше по словам
  if (currentIndex >= words.length && wrongQueue.length > 0) {
    // Когда дошли до конца списка, начинаем показывать ошибочные
    currentIndex = wrongQueue.shift();
  }
  showPhase2();
}

// === Фаза 5 ===
function markAnswer3(correct) {
  if (!correct) {
    wrongQueue.push(currentIndex);
  }
  currentIndex++;
  if (currentIndex >= words.length && wrongQueue.length > 0) {
    currentIndex = wrongQueue.shift();
  }
  showPhase3();
}

// === Общая логика при смене слова ===
function getCurrentIndex() {
  // теперь просто возвращаем текущий индекс
  return currentIndex;
}
// === Прогресс ===
function updateProgress() {
  const total = words.length;
  const passed = total - (wrongQueue.length + (total - currentIndex));
  const done = Math.max(0, Math.min(total, passed + 1));
  const percent = Math.min(100, Math.round((done / total) * 100));

  const bar = document.getElementById("progressBar");
  const text = document.getElementById("progressText");
  if (bar && text) {
    bar.style.width = percent + "%";
    bar.textContent = percent + "%";
    text.textContent = `Прогресс: ${done}/${total}`;
  }
}

// === Общие функции ===
function nextIndex() {
  if (wrongQueue.length > 0) {
    currentIndex = wrongQueue.shift();
  } else {
    currentIndex++;
  }
  updateProgress();
}

// === Unified, fixed phase & repeat logic ===

// очередь основного прохода и очередь повторов
let mainOrder = [];       // порядок индексов для первоначального показа
let mainPos = 0;          // указатель в mainOrder
let repeatQueue = [];     // очередь индексов для повторов (повторяются пока не верно)
let inRepeatMode = false; // флаг: мы сейчас показываем повторяющиеся слова
let lastFromRepeat = false; // вспомогательный флаг — текущий показ из repeatQueue?
let dictationRepeatQueue = []; // отдельная очередь для диктанта (тоже используется как repeatQueue)

// утилита: тасование массива (Fisher–Yates)
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// инициализация очередей для текущего набора words
function initPhaseQueues() {
  mainOrder = words.map((_, i) => i);
  mainPos = 0;
  repeatQueue = [];
  inRepeatMode = false;
  lastFromRepeat = false;
  // для диктанта отдельно: dictationRepeatQueue будет копироваться при входе в диктант
  dictationRepeatQueue = [];
  updateProgress();
}

// получить следующий индекс для текущей фазы (основной проход -> затем повторы)
function getNextIndexForPhase() {
  // Если не исчерпан основной проход — берем оттуда
  if (mainPos < mainOrder.length) {
    lastFromRepeat = false;
    return mainOrder[mainPos++];
  }

  // основной проход завершён — проверяем очередь повторов
  if (!inRepeatMode) {
    // входим в режим повторов — тасуем очередь один раз перед стартом
    inRepeatMode = true;
    repeatQueue = shuffleArray(Array.from(new Set(repeatQueue))); // уникализируем+тасуем
  }

  if (repeatQueue.length === 0) {
    // ничего для повтора — возврата нет
    return null;
  }

  lastFromRepeat = true;
  // берём следующий элемент из очереди повторов (FIFO)
  return repeatQueue.shift();
}

// ВЕРСИЯ ДЛЯ ДИКТАНТА (аналогично): инициализируем dictationQueue и dictationRepeatQueue
function initDictationQueues() {
  // основная очередь диктанта — все индексы
  mainOrder = words.map((_, i) => i);
  mainPos = 0;
  dictationRepeatQueue = [];
  inRepeatMode = false;
  lastFromRepeat = false;
  updateProgress();
}

function getNextIndexForDictation() {
  if (mainPos < mainOrder.length) {
    lastFromRepeat = false;
    return mainOrder[mainPos++];
  }

  if (!inRepeatMode) {
    inRepeatMode = true;
    dictationRepeatQueue = shuffleArray(Array.from(new Set(dictationRepeatQueue)));
  }

  if (dictationRepeatQueue.length === 0) return null;

  lastFromRepeat = true;
  return dictationRepeatQueue.shift();
}

// === Фаза 3: карточки (ознакомление) ===
function showNextCard() {
  // если это первый показ в фазе — инициализируем очереди
  if (currentIndex === 0 && !inRepeatMode && mainPos === 0 && repeatQueue.length === 0) {
    initPhaseQueues();
  }

  const idx = getNextIndexForPhase();
  if (idx === null) { // очередь пустая — идём на следующий этап
    goToNextPage();
    return;
  }

  currentIndex = idx;
  // показываем карточку
  document.getElementById("page3").classList.remove("hidden");
  document.getElementById("card").innerHTML =
    `<strong>${words[currentIndex]}</strong> [${transcriptions[currentIndex] || ""}] — ${translations[currentIndex] || ""}
     <button id="speakBtn">🔊</button>
     <button id="addToDictionaryBtn" class="dictionary-btn">${isInDictionary(words[currentIndex]) ? "★" : "☆"}</button>
     <button id="markKnownBtn">✅</button>
     <button id="markWrongBtn">❌</button>`;
  document.getElementById("cardExample").textContent = examples[currentIndex] || "";

  document.getElementById("speakBtn").onclick = () => speakWord(words[currentIndex]);
  document.getElementById("addToDictionaryBtn").onclick = () => toggleDictionary(words[currentIndex], document.getElementById("addToDictionaryBtn"));

  // маркировка: пользователь пометил слово как прошедшее (галочка)
  document.getElementById("markKnownBtn").onclick = () => {
    // если это был элемент из очереди повторов — просто не возвращаем его обратно (т.е. удалён)
    // если это был элемент из основного прохода — ничего в repeatQueue не добавляем
    // просто просмотреть следующее
    showNextCard();
    updateProgress();
  };

  // маркировка: пользователь пометил слово как НЕ прошедшее (крестик) — добавляем в очередь повторов
  document.getElementById("markWrongBtn").onclick = () => {
    // если помечают во время основного прохода — добавляем в repeatQueue
    // если помечают уже из repeat mode — добавим снова в конец, чтобы оно повторилось позже
    if (lastFromRepeat) {
      // добавляем в конец repeatQueue (оно уже было извлечено)
      repeatQueue.push(currentIndex);
    } else {
      // добавляем индекс — он будет учтён при входе в repeat mode
      repeatQueue.push(currentIndex);
    }
    showNextCard();
    updateProgress();
  };

  updateProgress();
}

// === Фаза 4: перевод → оригинал ===
function showPhase2() {
  // если первый показ в фазе — инициализируем очереди
  if (mainPos === 0 && !inRepeatMode && repeatQueue.length === 0) initPhaseQueues();

  const idx = getNextIndexForPhase();
  if (idx === null) { goToNextPage(); return; }

  currentIndex = idx;
  document.getElementById("page4").classList.remove("hidden");
  document.getElementById("answerSection").classList.add("hidden");
  document.getElementById("phase2-translation").innerHTML = translations[currentIndex] || "";
  document.getElementById("phase2-example").textContent = examples[currentIndex] || "";
  updateProgress();
}

function showAnswer() {
  document.getElementById("phase2-answer").textContent = `${words[currentIndex]} [${transcriptions[currentIndex] || ""}]`;
  document.getElementById("answerSection").classList.remove("hidden");
  let btn = document.getElementById("speakPhase4Btn");
  if (!btn) {
    btn = document.createElement("button");
    btn.id = "speakPhase4Btn";
    btn.textContent = "🔊";
    document.getElementById("answerSection").appendChild(btn);
  }
  btn.onclick = () => speakWord(words[currentIndex]);
}

function markAnswer(correct) {
  if (!correct) {
    // Если пользователь сделал ошибку — добавляем индекс в repeatQueue (он будет повторяться)
    if (lastFromRepeat) {
      // если это уже элемент из repeatQueue, отправляем его в конец очереди повторов
      repeatQueue.push(currentIndex);
    } else {
      repeatQueue.push(currentIndex);
    }
  } else {
    // если правильно и слово находится в repeatQueue (редкий случай), удалим его из повторов
    repeatQueue = repeatQueue.filter(i => i !== currentIndex);
  }

  // Показываем следующее
  const nextIdx = getNextIndexForPhase();
  if (nextIdx === null) { goToNextPage(); return; }
  currentIndex = nextIdx;
  // обновляем показ
  document.getElementById("phase2-translation").innerHTML = translations[currentIndex] || "";
  document.getElementById("phase2-example").textContent = examples[currentIndex] || "";
  document.getElementById("answerSection").classList.add("hidden");
  updateProgress();
}

// === Фаза 5: оригинал → перевод ===
function showPhase3() {
  // если первый показ в фазе — инициализируем очереди
  if (mainPos === 0 && !inRepeatMode && repeatQueue.length === 0) initPhaseQueues();

  const idx = getNextIndexForPhase();
  if (idx === null) { goToNextPage(); return; }

  currentIndex = idx;
  document.getElementById("page5").classList.remove("hidden");
  document.getElementById("answerSection3").classList.add("hidden");
  document.getElementById("phase3-original").textContent = words[currentIndex];
  document.getElementById("phase3-example").textContent = examples[currentIndex] || "";
  updateProgress();
}

function showAnswer3() {
  document.getElementById("phase3-answer").textContent = translations[currentIndex] || "";
  document.getElementById("answerSection3").classList.remove("hidden");
  let btn = document.getElementById("speakPhase5Btn");
  if (!btn) {
    btn = document.createElement("button");
    btn.id = "speakPhase5Btn";
    btn.textContent = "🔊";
    document.getElementById("answerSection3").appendChild(btn);
  }
  btn.onclick = () => speakWord(words[currentIndex]);
}

function markAnswer3(correct) {
  if (!correct) {
    if (lastFromRepeat) {
      repeatQueue.push(currentIndex);
    } else {
      repeatQueue.push(currentIndex);
    }
  } else {
    repeatQueue = repeatQueue.filter(i => i !== currentIndex);
  }

  const nextIdx = getNextIndexForPhase();
  if (nextIdx === null) { goToNextPage(); return; }
  currentIndex = nextIdx;
  document.getElementById("answerSection3").classList.add("hidden");
  document.getElementById("phase3-original").textContent = words[currentIndex];
  document.getElementById("phase3-example").textContent = examples[currentIndex] || "";
  updateProgress();
}

// === Фаза 6: диктант (через аналогичный подход) ===
function startDictationPhase() {
  // инициализируем отдельные очереди для диктанта
  initDictationQueues();
  // основная последовательность — все слова
  // dictationRepeatQueue будет наполняться только ошибками
  showNextDictationWord();
}

function showNextDictationWord() {
  const idx = getNextIndexForDictation();
  if (idx === null) {
    finishLesson();
    return;
  }
  currentIndex = idx;

  hideAllPages();
  const page = document.getElementById("page6");
  page.classList.remove("hidden");

  document.getElementById("dictation-translation").textContent = translations[currentIndex] || "";
  document.getElementById("dictation-example").textContent = examples[currentIndex] || "";

  const inputEl = document.getElementById("dictation-input");
  inputEl.value = "";
  inputEl.focus();
  document.getElementById("dictation-feedback").textContent = "";
  dictationWaiting = false;

  let btn = document.getElementById("speakDictationBtn");
  if (!btn) {
    btn = document.createElement("button");
    btn.id = "speakDictationBtn";
    btn.textContent = "🔊";
    page.appendChild(btn);
  }
  btn.onclick = () => speakWord(words[currentIndex]);
}

function checkDictation() {
  if (dictationWaiting) return; // ждем нажатия "Следующее" после ошибки

  const inputEl = document.getElementById("dictation-input");
  const userAnswer = (inputEl.value || "").trim();
  const correctWord = words[currentIndex] || "";

  if (!userAnswer) {
    document.getElementById("dictation-feedback").textContent = "Введите слово.";
    return;
  }

  if (userAnswer.toLowerCase() === correctWord.toLowerCase()) {
    document.getElementById("dictation-feedback").textContent = "✅ Верно!";
    // если было в repeat-очереди — удаляем из неё
    dictationRepeatQueue = dictationRepeatQueue.filter(i => i !== currentIndex);
    // короткая пауза — дальше
    setTimeout(showNextDictationWord, 350);
  } else {
    document.getElementById("dictation-feedback").textContent = `❌ Неверно. Правильный ответ показан. Слово будет повторено позже.`;
    inputEl.value = correctWord;
    // добавляем в очередь повторов диктанта
    dictationRepeatQueue.push(currentIndex);
    // отмечаем, что теперь ждём ручного "Следующее"
    dictationWaiting = true;
  }
}

function nextDictationAfterError() {
  if (!dictationWaiting) return;
  // войдя сюда, мы переместились к следующему элементу
  // Перенастроим глобальные dictation repeat/ordering:
  // Поместим dictationRepeatQueue в repeat-очередь для диктанта и продолжим
  // Нужно, чтобы getNextIndexForDictation использовал dictationRepeatQueue (оно уже используется).
  showNextDictationWord();
}

// === Progress & helper ===
function updateProgress() {
  const total = words.length || 1;
  // Завершено — количество уже прошедших элементов основного прохода
  const mainDone = Math.min(mainPos, total);
  // Если на повторе — количество уже успешно закрытых = total - repeatQueue.length (для общих фаз)
  const repeatRemaining = inRepeatMode ? repeatQueue.length : 0;
  const done = Math.min(total, mainDone + (inRepeatMode ? (total - repeatRemaining - (mainDone > total ? mainDone - total : 0)) : 0));
  const percent = Math.round((done / total) * 100);

  const bar = document.getElementById("progressBar");
  const text = document.getElementById("progressText");
  if (bar && text) {
    bar.style.width = Math.min(100, percent) + "%";
    bar.textContent = Math.min(100, percent) + "%";
    text.textContent = `Прогресс: ${Math.min(done, total)}/${total}`;
  }
}

// Переопределяем переход на следующую страницу — чтобы корректно рестартовать очереди там, где нужно
function goToNextPage() {
  if (currentPhase === 3) startPhase(4);
  else if (currentPhase === 4) startPhase(5);
  else if (currentPhase === 5) startPhase(6);
  else finishLesson();
}

// Повторить этап — сбрасываем очереди и показываем соответствующую фазу
function repeatPhase() {
  // Сбрасываем флаги очередей, чтобы пользователь заново прошёл этап
  initPhaseQueues();
  if (currentPhase > 3) startPhase(currentPhase - 1);
  else startPhase(3);
}
