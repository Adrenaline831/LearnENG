<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn English</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Кнопка меню -->
<button class="menu__btn" id="menuBtn">☰ Меню</button>
<ul class="menu__nav" id="menuDropdown">
  <!-- Кнопка «Мой словарь» -->
  <li class="menu__nav-item">
    <button class="level-btn" id="myDictionaryBtn">Мой словарь</button>
  </li>
</ul>

<div id="lessonContent">
  <div id="progressText"></div>
  <div id="progressBarContainer">
    <div id="progressBar">0%</div>
  </div>

  <!-- Страница 0: самостоятельный ввод слов -->
  <div id="page0">
    <h2>Введите английские слова (по одному на строку)</h2>
    <textarea id="englishWords" rows="8" placeholder="cat&#10;dog&#10;pig"></textarea><br>
    <button onclick="goToTranscription()">Дальше</button>
  </div>

  <!-- Страница 1: транскрипции -->
  <div id="page1_5" class="hidden">
    <h2>Введите транскрипции (можно пропустить)</h2>
    <textarea id="englishTranscription" rows="8" placeholder="kæt&#10;dɒg&#10;pɪg"></textarea><br>
    <button onclick="skipTranscription()">Пропустить</button>
    <button onclick="goToTranslations()">Дальше</button>
  </div>

  <!-- Страница 2: переводы -->
  <div id="page2" class="hidden">
    <h2>Введите переводы (по одному на строку)</h2>
    <textarea id="translatedWords" rows="8" placeholder="кот&#10;собака&#10;свинья"></textarea><br>
    <button onclick="startSelfLearning()">Начать обучение</button>
  </div>

  <!-- Фазы обучения -->
  <div id="page3" class="hidden">
    <h2>Фаза 1: Ознакомление</h2>
    <p id="card">
      <span id="cardWord"></span>
      <button id="addToDictionaryBtn" class="dictionary-btn">☆</button>
    </p>
    <div class="example" id="cardExample"></div>
    <button onclick="showNextCard()">Далее</button>
    <button onclick="repeatPhase()">Повторить этап</button>
    <button onclick="goToNextPage()">Пропустить этап</button>
  </div>

  <div id="page4" class="hidden">
    <h2>Фаза 2: Перевод → Оригинал</h2>
    <p id="phase2-translation">
      <span id="phase2Word"></span>
      <button id="addToDictionaryBtn2" class="dictionary-btn">☆</button>
    </p>
    <div class="example" id="phase2-example"></div>
    <button id="showAnswerBtn" onclick="showAnswer()">Показать ответ</button>
    <div id="answerSection" class="hidden">
      <p id="phase2-answer"></p>
      <button onclick="markAnswer(true)">✅</button>
      <button onclick="markAnswer(false)">❌</button>
      <button onclick="repeatPhase()">Повторить этап</button>
      <button onclick="goToNextPage()">Пропустить этап</button>
    </div>
  </div>

  <div id="page5" class="hidden">
    <h2>Фаза 3: Оригинал → Перевод</h2>
    <p id="phase3-original">
      <span id="phase3Word"></span>
      <button id="addToDictionaryBtn3" class="dictionary-btn">☆</button>
    </p>
    <div class="example" id="phase3-example"></div>
    <button id="showAnswerBtn3" onclick="showAnswer3()">Показать ответ</button>
    <div id="answerSection3" class="hidden">
      <p id="phase3-answer"></p>
      <button onclick="markAnswer3(true)">✅</button>
      <button onclick="markAnswer3(false)">❌</button>
      <button onclick="repeatPhase()">Повторить этап</button>
      <button onclick="goToNextPage()">Пропустить этап</button>
    </div>
  </div>

  <div id="page6" class="hidden">
    <h2>Фаза 4: Диктант</h2>
    <p id="dictation-translation"></p>
    <div class="example" id="dictation-example"></div>
    <input type="text" id="dictation-input" placeholder="Введите английское слово" autocomplete="off">
    <button id="dictationCheckBtn" onclick="checkDictation()">Проверить</button>
    <button id="dictationNextBtn" onclick="nextDictationAfterError()">Следующее</button>
    <p id="dictation-feedback"></p>
  </div>

  <div id="finishPage" class="hidden">
    <h2>🎉 Урок завершён!</h2>
    <button onclick="backToMenu()">Вернуться к меню</button>
  </div>
</div>

<script>
/* ====================================================
   Очистка и единая рабочая версия скрипта проекта
   ==================================================== */

/* === Глобальные переменные === */
let lessonsDB = {};
let currentLesson = null;
let currentLessonElement = null;

let words = [];
let transcriptions = [];
let translations = [];
let examples = [];

let currentPhase = 0;

let currentIndex = 0;

let lastSpokenWord = "";
let slowMode = false;

let pullExamplesFromJSON = true;

/* === Очереди обучения === */
let mainQueue = [];
let wrongQueue = [];
let queuePosition = 0;
let repeatingWrong = false;


/* === LocalStorage: словарь и завершённые уроки === */

const LOCAL_STORAGE_KEY = "myDictionary";
const FINISHED_LESSONS_KEY = "finishedLessons";

function getMyDictionary() {
  const dict = localStorage.getItem(LOCAL_STORAGE_KEY);
  return dict ? JSON.parse(dict) : [];
}

function saveMyDictionary(dict) {
  localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(dict));
}

function getFinishedLessons() {
  const finished = localStorage.getItem(FINISHED_LESSONS_KEY);
  return finished ? JSON.parse(finished) : {};
}

function saveFinishedLesson(level, lessonKey) {
  const finished = getFinishedLessons();
  if (!finished[level]) finished[level] = [];
  if (!finished[level].includes(lessonKey)) finished[level].push(lessonKey);
  localStorage.setItem(FINISHED_LESSONS_KEY, JSON.stringify(finished));
}


/* === Проверка словаря === */

function isInDictionary(word) {
  return getMyDictionary().includes(word);
}

function toggleDictionary(word, button) {
  let dict = getMyDictionary();

  if (dict.includes(word)) {
    dict = dict.filter(w => w !== word);
    if (button) button.textContent = "☆";
  } else {
    dict.push(word);
    if (button) button.textContent = "★";
  }

  saveMyDictionary(dict);
}


/* === Озвучка === */

function speakWord(word) {

  if (!word) return;

  const utter = new SpeechSynthesisUtterance(word);

  utter.lang = "en-US";
  utter.rate = slowMode ? 0.7 : 1.0;

  speechSynthesis.cancel();
  speechSynthesis.speak(utter);

  slowMode = (lastSpokenWord === word) ? !slowMode : false;
  lastSpokenWord = word;
}


/* === Загружаем JSON с уроками === */

fetch("lessons.json")

  .then(res => res.json())

  .then(data => {
    lessonsDB = data;
    generateLevelsMenu();
    addSettingsMenu();
  })

  .catch(err => console.error("Ошибка загрузки JSON:", err));


/* === Меню === */

document.getElementById("menuBtn").addEventListener("click", () => {
  document.getElementById("menuDropdown").classList.toggle("show");
});


/* === Генерация уровней и уроков === */

function generateLevelsMenu() {

  const menu = document.getElementById("menuDropdown");

  menu.innerHTML = "";

  const finished = getFinishedLessons();

  Object.keys(lessonsDB).forEach(level => {

    const li = document.createElement("li");
    li.classList.add("menu__nav-item");

    const btn = document.createElement("button");
    btn.textContent = level;
    btn.classList.add("level-btn");

    li.appendChild(btn);

    const ul = document.createElement("ul");
    ul.classList.add("submenu");
    ul.style.display = "none";

    Object.keys(lessonsDB[level]).forEach(lessonKey => {

      const lessonLi = document.createElement("li");

      lessonLi.textContent = lessonsDB[level][lessonKey].title;
      lessonLi.style.cursor = "pointer";

      if (finished[level] && finished[level].includes(lessonKey)) {
        lessonLi.style.backgroundColor = "#6fcf97";
        lessonLi.style.color = "#000";
      }

      lessonLi.addEventListener("click", () => {

        startLesson(level, lessonKey);

        if (currentLessonElement) {
          currentLessonElement.style.backgroundColor = "";
          currentLessonElement.style.color = "";
        }

        lessonLi.style.backgroundColor = "#ffd966";
        lessonLi.style.color = "#000";

        currentLessonElement = lessonLi;

        setTimeout(() => {
          document.getElementById("page3").scrollIntoView({ behavior: "smooth" });
        }, 300);

      });

      ul.appendChild(lessonLi);

    });

    li.appendChild(ul);
    menu.appendChild(li);

    btn.addEventListener("click", () => {

      const isShown = ul.style.display === "block";

      document.querySelectorAll(".submenu").forEach(sub => sub.style.display = "none");

      ul.style.display = isShown ? "none" : "block";

    });

  });

  const dictBtn = document.createElement("li");

  dictBtn.innerHTML = `<button id="myDictionaryBtn">★ Мой словарь</button>`;

  menu.appendChild(dictBtn);

  document.getElementById("myDictionaryBtn")
    .addEventListener("click", startDictionaryLesson);
}


/* === Управление страницами === */

function hideAllPages() {

  [
    "page0","page1_5","page2",
    "page3","page4","page5","page6",
    "finishPage"
  ].forEach(id => {

    const el = document.getElementById(id);
    if (el) el.classList.add("hidden");

  });

}


/* =======================
   Универсальная система очередей
   ======================= */

function initQueue() {

  mainQueue = words.map((_, i) => i);

  wrongQueue = [];

  queuePosition = 0;

  repeatingWrong = false;

  updateProgress();
}

function getCurrentIndex() {

  if (!repeatingWrong) {
    return mainQueue[queuePosition];
  } else {
    return wrongQueue[queuePosition];
  }

}

function goNextInQueue() {

  queuePosition++;

  if (!repeatingWrong) {

    if (queuePosition >= mainQueue.length) {

      if (wrongQueue.length > 0) {

        repeatingWrong = true;
        queuePosition = 0;

      } else {

        goToNextPage();
        return;

      }

    }

  } else {

    if (queuePosition >= wrongQueue.length) {

      goToNextPage();
      return;

    }

  }

  updateProgress();
}


/* =======================
   Прогресс
   ======================= */

function updateProgress() {

  const total = words.length;

  let done;

  if (!repeatingWrong) {
    done = Math.min(queuePosition, total);
  } else {
    done = total;
  }

  const percent = Math.min(100, Math.round((done / total) * 100));

  const bar = document.getElementById("progressBar");
  const text = document.getElementById("progressText");

  if (bar && text) {

    bar.style.width = percent + "%";
    bar.textContent = percent + "%";

    text.textContent = `Прогресс: ${done}/${total}`;

  }

}


/* =======================
   Фаза 2
   ======================= */

function showPhase2() {

  hideAllPages();
  document.getElementById("page4").classList.remove("hidden");

  document.getElementById("answerSection").classList.add("hidden");

  const i = getCurrentIndex();

  document.getElementById("phase2-translation").textContent = translations[i];
  document.getElementById("phase2-example").textContent = examples[i] || "";

}

function markAnswer(correct) {

  const i = getCurrentIndex();

  if (!correct && !repeatingWrong) {
    wrongQueue.push(i);
  }

  goNextInQueue();

  if (queuePosition < mainQueue.length || repeatingWrong) {
    showPhase2();
  }

}


/* =======================
   Фаза 3
   ======================= */

function showPhase3() {

  hideAllPages();
  document.getElementById("page5").classList.remove("hidden");

  document.getElementById("answerSection3").classList.add("hidden");

  const i = getCurrentIndex();

  document.getElementById("phase3-original").textContent = words[i];
  document.getElementById("phase3-example").textContent = examples[i] || "";

}

function markAnswer3(correct) {

  const i = getCurrentIndex();

  if (!correct && !repeatingWrong) {
    wrongQueue.push(i);
  }

  goNextInQueue();

  if (queuePosition < mainQueue.length || repeatingWrong) {
    showPhase3();
  }

}


/* =======================
   Диктант
   ======================= */

let dictationQueue = [];
let dictationRepeatingWrong = false;
let dictationPos = 0;

function startDictationPhase() {

  dictationQueue = words.map((_, i) => i);

  wrongQueue = [];

  dictationPos = 0;

  dictationRepeatingWrong = false;

  showNextDictationWord();
}

function showNextDictationWord() {

  if (!dictationRepeatingWrong && dictationPos >= dictationQueue.length) {

    if (wrongQueue.length > 0) {

      dictationRepeatingWrong = true;

      dictationQueue = [...wrongQueue];

      wrongQueue = [];

      dictationPos = 0;

    } else {

      finishLesson();
      return;

    }

  }

  if (dictationRepeatingWrong && dictationPos >= dictationQueue.length) {

    finishLesson();
    return;

  }

  hideAllPages();
  document.getElementById("page6").classList.remove("hidden");

  const index = dictationQueue[dictationPos];

  document.getElementById("dictation-translation").textContent = translations[index] || "";
  document.getElementById("dictation-example").textContent = examples[index] || "";

  const input = document.getElementById("dictation-input");

  input.value = "";
  input.focus();

  document.getElementById("dictation-feedback").textContent = "";

}

function checkDictation() {

  const index = dictationQueue[dictationPos];

  const inputEl = document.getElementById("dictation-input");

  const userAnswer = inputEl.value.trim();

  const correctWord = words[index];

  if (!userAnswer) return;

  if (userAnswer.toLowerCase() === correctWord.toLowerCase()) {

    dictationPos++;
    showNextDictationWord();

  } else {

    inputEl.value = correctWord;

    wrongQueue.push(index);

  }

}

function nextDictationAfterError() {

  dictationPos++;

  showNextDictationWord();

}
</script>

</body>
</html>
