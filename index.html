<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn English</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Кнопка меню -->
<button class="menu__btn" id="menuBtn">☰ Меню</button>
<ul class="menu__nav" id="menuDropdown">
  <!-- Кнопка «Мой словарь» -->
  <li class="menu__nav-item">
    <button class="level-btn" id="myDictionaryBtn">Мой словарь</button>
  </li>
</ul>

<div id="lessonContent">
  <div id="progressText"></div>
  <div id="progressBarContainer">
    <div id="progressBar">0%</div>
  </div>

  <!-- Страница 0: самостоятельный ввод слов -->
  <div id="page0">
    <h2>Введите английские слова (по одному на строку)</h2>
    <textarea id="englishWords" rows="8" placeholder="cat&#10;dog&#10;pig"></textarea><br>
    <button onclick="goToTranscription()">Дальше</button>
  </div>

  <!-- Страница 1: транскрипции -->
  <div id="page1_5" class="hidden">
    <h2>Введите транскрипции (можно пропустить)</h2>
    <textarea id="englishTranscription" rows="8" placeholder="kæt&#10;dɒg&#10;pɪg"></textarea><br>
    <button onclick="skipTranscription()">Пропустить</button>
    <button onclick="goToTranslations()">Дальше</button>
  </div>

  <!-- Страница 2: переводы -->
  <div id="page2" class="hidden">
    <h2>Введите переводы (по одному на строку)</h2>
    <textarea id="translatedWords" rows="8" placeholder="кот&#10;собака&#10;свинья"></textarea><br>
    <button onclick="startSelfLearning()">Начать обучение</button>
  </div>

  <!-- Фазы обучения -->
  <div id="page3" class="hidden">
    <h2>Фаза 1: Ознакомление</h2>
    <p id="card">
      <span id="cardWord"></span>
      <button id="addToDictionaryBtn" class="dictionary-btn">☆</button>
    </p>
    <div class="example" id="cardExample"></div>
    <button onclick="showNextCard(true)">Далее</button>
    <button onclick="showNextCard(false)">❌</button>
    <button onclick="repeatPhase()">Повторить этап</button>
    <button onclick="goToNextPage()">Пропустить этап</button>
  </div>

  <div id="page4" class="hidden">
<h2>Фаза 2: Оригинал → Перевод</h2>
<p id="phase2-translation">
      <span id="phase2Word"></span>
      <button id="addToDictionaryBtn2" class="dictionary-btn">☆</button>
    </p>
    <div class="example" id="phase2-example"></div>
    <button id="showAnswerBtn" onclick="showAnswer()">Показать ответ</button>
    <div id="answerSection" class="hidden">
      <p id="phase2-answer"></p>
      <button onclick="markAnswer(true)">✅</button>
      <button onclick="markAnswer(false)">❌</button>
      <button onclick="repeatPhase()">Повторить этап</button>
      <button onclick="goToNextPage()">Пропустить этап</button>
    </div>
  </div>

  <div id="page5" class="hidden">
    <h2>Фаза 3: Перевод → Оригинал</h2>
<p id="phase3-original">
      <span id="phase3Word"></span>
      <button id="addToDictionaryBtn3" class="dictionary-btn">☆</button>
    </p>
    <div class="example" id="phase3-example"></div>
    <button id="showAnswerBtn3" onclick="showAnswer3()">Показать ответ</button>
    <div id="answerSection3" class="hidden">
      <p id="phase3-answer"></p>
      <button onclick="markAnswer3(true)">✅</button>
      <button onclick="markAnswer3(false)">❌</button>
      <button onclick="repeatPhase()">Повторить этап</button>
      <button onclick="goToNextPage()">Пропустить этап</button>
    </div>
  </div>

  <div id="page6" class="hidden">
    <h2>Фаза 4: Диктант</h2>
    <p id="dictation-translation"></p>
    <div class="example" id="dictation-example"></div>
    <input type="text" id="dictation-input" placeholder="Введите английское слово" autocomplete="off">
    <button id="dictationCheckBtn" onclick="checkDictation()">Проверить</button>
    <button id="dictationNextBtn" onclick="nextDictationAfterError()">Следующее</button>
    <p id="dictation-feedback"></p>
  </div>

  <div id="finishPage" class="hidden">
    <h2>🎉 Урок завершён!</h2>
    <button onclick="backToMenu()">Вернуться к меню</button>
  </div>
</div>

<script>
/* ====================================================
   Очистка и единая рабочая версия скрипта проекта
   ==================================================== */

/* === Глобальные переменные === */
let lessonsDB = {};
let currentLesson = null;
let currentLessonElement = null;
let words = [];
let transcriptions = [];
let translations = [];
let examples = [];
let currentPhase = 0; // 3 - карточки, 4 - перевод->оригинал, 5 - оригинал->перевод, 6 - диктант
let currentIndex = 0;
let wrongQueue = [];
let phaseQueue = [];
let dictationQueue = [];
let dictationWaiting = false;
let pullExamplesFromJSON = true;
let lastSpokenWord = "";
let slowMode = false;
let currentTheme = "theme-default";
let currentLearningLanguage = "english";
let historyNavigationEnabled = false;
let suppressPopStateHandler = false;

/* === LocalStorage: словарь и завершённые уроки === */
const LOCAL_STORAGE_KEY = "myDictionary";
const CUSTOM_DICTIONARY_STORAGE_KEY = "customDictionaryLessons";
const FINISHED_LESSONS_KEY_PREFIX = "finishedLessons";
const THEME_STORAGE_KEY = "selectedTheme";
const EXAMPLE_MODE_STORAGE_KEY = "pullExamplesFromJSON";
const LEARNING_LANGUAGE_STORAGE_KEY = "learningLanguage";
const LEARNING_PROGRESS_STORAGE_KEY = "learningProgressState";
const REPEAT_LESSON_WORDS_COUNT = 30;
const LESSONS_FILES = {
  english: "lessons.json",
  french: "french_lessons.json"
};

const THEMES = [
  { id: "theme-default", label: "Fresh Green" },
  { id: "theme-classic-dark", label: "Classic Dark" },
  { id: "theme-second", label: "Olive Sand" },
  { id: "theme-darkred", label: "Dark Red" },
  { id: "theme-midnight", label: "Midnight Blue" },
  { id: "theme-lavender", label: "Lavender Neon" },
  { id: "theme-sunset", label: "Sunset Glow" },
  { id: "theme-cybermint", label: "Cyber Mint" }
];

function getMyDictionary() {
  const dict = localStorage.getItem(LOCAL_STORAGE_KEY);
  return dict ? JSON.parse(dict) : [];
}
function saveMyDictionary(dict) {
  localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(dict));
}
function getCustomDictionaryLessons() {
  const customLessons = localStorage.getItem(CUSTOM_DICTIONARY_STORAGE_KEY);
  return customLessons ? JSON.parse(customLessons) : [];
}
function saveCustomDictionaryLessons(customLessons) {
  localStorage.setItem(CUSTOM_DICTIONARY_STORAGE_KEY, JSON.stringify(customLessons));
}
function getFinishedLessons() {
  const finished = localStorage.getItem(getFinishedLessonsStorageKey());
  return finished ? JSON.parse(finished) : {};
}
function saveFinishedLesson(level, lessonKey) {
  const finished = getFinishedLessons();
  if (!finished[level]) finished[level] = [];
  if (!finished[level].includes(lessonKey)) finished[level].push(lessonKey);
  localStorage.setItem(getFinishedLessonsStorageKey(), JSON.stringify(finished));
}

function getFinishedLessonsStorageKey() {
  return `${FINISHED_LESSONS_KEY_PREFIX}_${currentLearningLanguage}`;
}

function getPullExamplesFlag() {
  const saved = localStorage.getItem(EXAMPLE_MODE_STORAGE_KEY);
  if (saved === null) return true;
  return saved === "true";
}

function savePullExamplesFlag(value) {
  localStorage.setItem(EXAMPLE_MODE_STORAGE_KEY, String(value));
}

function applyTheme(themeId) {
  const body = document.body;
  THEMES.forEach(theme => {
    if (theme.id !== "theme-default") body.classList.remove(theme.id);
  });
  if (themeId && themeId !== "theme-default") body.classList.add(themeId);
  currentTheme = themeId || "theme-default";
  localStorage.setItem(THEME_STORAGE_KEY, currentTheme);
}

function loadSavedPreferences() {
  pullExamplesFromJSON = getPullExamplesFlag();
  const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "theme-default";
  const knownTheme = THEMES.some(t => t.id === savedTheme) ? savedTheme : "theme-default";
  applyTheme(knownTheme);
  const savedLanguage = localStorage.getItem(LEARNING_LANGUAGE_STORAGE_KEY) || "english";
  currentLearningLanguage = LESSONS_FILES[savedLanguage] ? savedLanguage : "english";
}

function shuffleArray(items) {
  const arr = [...items];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function normalizeWordKey(word) {
  return String(word || "").trim().toLowerCase();
}

function collectWordsFromFinishedLessons() {
  const finished = getFinishedLessons();
  const allWords = [];

  Object.keys(finished).forEach(level => {
    const finishedKeys = finished[level] || [];
    finishedKeys.forEach(lessonKey => {
      const lesson = lessonsDB[level]?.[lessonKey];
      if (!lesson) return;
      const lessonWords = lesson.english || lesson.french || [];
      allWords.push(...lessonWords);
    });
  });

  return allWords;
}

function buildWordPoolForRepeatLesson() {
  const userDictionaryWords = getMyDictionary();
  const customLessonsWords = getCustomDictionaryLessons().flatMap(lesson => lesson.words || []);
  const finishedLessonsWords = collectWordsFromFinishedLessons();
  const sourceWords = [
    ...userDictionaryWords,
    ...customLessonsWords,
    ...finishedLessonsWords
  ];

  const uniqueWords = [];
  const seen = new Set();
  sourceWords.forEach(word => {
    const key = normalizeWordKey(word);
    if (!key || seen.has(key)) return;
    seen.add(key);
    uniqueWords.push(String(word).trim());
  });

  return uniqueWords;
}

function startRepeatLesson() {
  const pool = buildWordPoolForRepeatLesson();
  if (pool.length === 0) {
    alert("Недостаточно слов для повторения. Добавьте избранные слова, пользовательский словарь или завершите несколько уроков.");
    return;
  }

  const selectedWords = shuffleArray(pool).slice(0, REPEAT_LESSON_WORDS_COUNT);
  const foundWords = [];
  const foundTranscriptions = [];
  const foundTranslations = [];
  const foundExamples = [];

  selectedWords.forEach(word => {
    let found = false;
    for (const levelKey in lessonsDB) {
      for (const lessonKey in lessonsDB[levelKey]) {
        const lesson = lessonsDB[levelKey][lessonKey];
        const lessonWords = lesson.english || lesson.french || [];
        const index = lessonWords.findIndex(item => normalizeWordKey(item) === normalizeWordKey(word));
        if (index === -1) continue;

        const lessonTranslations = lesson.translated || lesson.english || lesson.french || [];
        foundWords.push(lessonWords[index] || word);
        foundTranscriptions.push((lesson.transcriptions || [])[index] || "");
        foundTranslations.push(lessonTranslations[index] || "(перевод)");
        foundExamples.push((lesson.example || [])[index] || "");
        found = true;
        break;
      }
      if (found) break;
    }

    if (!found) {
      foundWords.push(word);
      foundTranscriptions.push("");
      foundTranslations.push("(перевод не найден)");
      foundExamples.push("");
    }
  });

  currentLesson = null;
  words = foundWords;
  transcriptions = foundTranscriptions;
  translations = foundTranslations;
  examples = foundExamples;
  currentPhase = 3;
  currentIndex = 0;
  wrongQueue = [];
  hideAllPages();
  startPhase(currentPhase);
  saveLearningProgress();
  document.getElementById("menuDropdown").classList.remove("show");
}

function getCurrentVisiblePageId() {
  const pageIds = ["page0","page1_5","page2","page3","page4","page5","page6","finishPage"];
  for (const id of pageIds) {
    const el = document.getElementById(id);
    if (el && !el.classList.contains("hidden")) return id;
  }
  return "page0";
}

function saveLearningProgress() {
  const payload = {
    words,
    transcriptions,
    translations,
    examples,
    currentPhase,
    currentIndex,
    phaseQueue,
    dictationQueue,
    dictationWaiting,
    currentLesson,
    visiblePage: getCurrentVisiblePageId()
  };
  localStorage.setItem(LEARNING_PROGRESS_STORAGE_KEY, JSON.stringify(payload));
}

function clearLearningProgress() {
  localStorage.removeItem(LEARNING_PROGRESS_STORAGE_KEY);
}

function updateHistoryStage(stage, replace = false) {
  if (!historyNavigationEnabled || suppressPopStateHandler) return;
  const state = { stage };
  if (replace) history.replaceState(state, "", `#${stage}`);
  else history.pushState(state, "", `#${stage}`);
}

function restoreLearningProgress() {
  const rawState = localStorage.getItem(LEARNING_PROGRESS_STORAGE_KEY);
  if (!rawState) return;

  try {
    const state = JSON.parse(rawState);
    if (!Array.isArray(state.words) || state.words.length === 0) return;

    words = state.words;
    transcriptions = Array.isArray(state.transcriptions) ? state.transcriptions : words.map(() => "");
    translations = Array.isArray(state.translations) ? state.translations : words.map(() => "");
    examples = Array.isArray(state.examples) ? state.examples : words.map(() => "");
    currentPhase = Number.isInteger(state.currentPhase) ? state.currentPhase : 3;
    currentIndex = Number.isInteger(state.currentIndex) ? state.currentIndex : 0;
    phaseQueue = Array.isArray(state.phaseQueue) ? state.phaseQueue : words.map((_, i) => i);
    dictationQueue = Array.isArray(state.dictationQueue) ? state.dictationQueue : words.map((_, i) => i);
    dictationWaiting = Boolean(state.dictationWaiting);
    currentLesson = state.currentLesson || null;

    if (currentPhase >= 3 && currentPhase <= 6) {
      hideAllPages();
      if (currentPhase === 3) showNextCard(null);
      else if (currentPhase === 4) showPhase2();
      else if (currentPhase === 5) showPhase3();
      else if (currentPhase === 6) showNextDictationWord();
    }
  } catch (err) {
    console.error("Не удалось восстановить прогресс:", err);
    clearLearningProgress();
  }
}

function initHistoryNavigation() {
  historyNavigationEnabled = true;
  updateHistoryStage(getCurrentVisiblePageId(), true);

  window.addEventListener("popstate", () => {
    if (suppressPopStateHandler) return;
    suppressPopStateHandler = true;
    const visiblePage = getCurrentVisiblePageId();

    if (visiblePage === "page6") startPhase(5);
    else if (visiblePage === "page5") startPhase(4);
    else if (visiblePage === "page4") startPhase(3);
    else if (visiblePage === "page3") backToMenu();
    else if (visiblePage === "page2") {
      hideAllPages();
      document.getElementById("page1_5").classList.remove("hidden");
      saveLearningProgress();
    } else if (visiblePage === "page1_5") {
      hideAllPages();
      document.getElementById("page0").classList.remove("hidden");
      saveLearningProgress();
    }
    suppressPopStateHandler = false;
  });
}

/* === Проверка словаря === */
function isInDictionary(word) {
  return getMyDictionary().includes(word);
}
function toggleDictionary(word, button) {
  let dict = getMyDictionary();
  if (dict.includes(word)) {
    dict = dict.filter(w => w !== word);
    if (button) button.textContent = "☆";
  } else {
    dict.push(word);
    if (button) button.textContent = "★";
  }
  saveMyDictionary(dict);
}

/* === Озвучка === */
function speakWord(word) {
  if (!word) return;
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = currentLearningLanguage === "french" ? "fr-FR" : "en-US";
  utter.rate = slowMode ? 0.7 : 1.0;
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
  slowMode = (lastSpokenWord === word) ? !slowMode : false;
  lastSpokenWord = word;
}

/* === Загружаем JSON с уроками === */
async function loadLessonsForLanguage(language) {
  const selectedLanguage = LESSONS_FILES[language] ? language : "english";
  const fileName = LESSONS_FILES[selectedLanguage];
  try {
    const res = await fetch(fileName);
    lessonsDB = await res.json();
    currentLearningLanguage = selectedLanguage;
    localStorage.setItem(LEARNING_LANGUAGE_STORAGE_KEY, selectedLanguage);
    currentLesson = null;
    currentLessonElement = null;
    generateLevelsMenu();
    addSettingsMenu();
  } catch (err) {
    console.error("Ошибка загрузки JSON:", err);
    alert("Не удалось загрузить уроки для выбранного языка.");
  }
}

loadSavedPreferences();
loadLessonsForLanguage(currentLearningLanguage);
restoreLearningProgress();
initHistoryNavigation();
window.addEventListener("beforeunload", saveLearningProgress);

/* === Меню === */
document.getElementById("menuBtn").addEventListener("click", () => {
  document.getElementById("menuDropdown").classList.toggle("show");
});

/* === Генерация уровней и уроков (единственная версия) === */
function generateLevelsMenu() {
  const menu = document.getElementById("menuDropdown");
  menu.innerHTML = "";
  const finished = getFinishedLessons();

  const languageLi = document.createElement("li");
  languageLi.classList.add("menu__nav-item");
  const languageBtn = document.createElement("button");
  languageBtn.textContent = `Язык изучения: ${currentLearningLanguage === "french" ? "Французский" : "Английский"}`;
  languageBtn.classList.add("level-btn");
  languageLi.appendChild(languageBtn);

  const languageWindow = document.createElement("div");
  languageWindow.style.display = "none";
  languageWindow.style.position = "relative";
  languageWindow.style.zIndex = "10";
  languageWindow.style.padding = "10px";
  languageWindow.style.marginTop = "5px";
  languageWindow.style.backgroundColor = "#3a3a3a";
  languageWindow.style.borderRadius = "5px";

  const englishBtn = document.createElement("button");
  englishBtn.textContent = currentLearningLanguage === "english" ? "Английский ✓" : "Английский";
  englishBtn.style.display = "block";
  englishBtn.style.width = "100%";
  englishBtn.style.marginBottom = "6px";
  englishBtn.onclick = async () => {
    if (currentLearningLanguage === "english") return;
    await loadLessonsForLanguage("english");
  };

  const frenchBtn = document.createElement("button");
  frenchBtn.textContent = currentLearningLanguage === "french" ? "Французский ✓" : "Французский";
  frenchBtn.style.display = "block";
  frenchBtn.style.width = "100%";
  frenchBtn.onclick = async () => {
    if (currentLearningLanguage === "french") return;
    await loadLessonsForLanguage("french");
  };

  languageWindow.appendChild(englishBtn);
  languageWindow.appendChild(frenchBtn);
  languageLi.appendChild(languageWindow);
  menu.appendChild(languageLi);

  languageBtn.addEventListener("click", () => {
    const isShown = languageWindow.style.display === "block";
    document.querySelectorAll("#menuDropdown > li > div").forEach(div => div.style.display = "none");
    languageWindow.style.display = isShown ? "none" : "block";
  });

  Object.keys(lessonsDB).forEach(level => {
    const li = document.createElement("li");
    li.classList.add("menu__nav-item");

    const btn = document.createElement("button");
    btn.textContent = level;
    btn.classList.add("level-btn");
    li.appendChild(btn);

    const ul = document.createElement("ul");
    ul.classList.add("submenu");
    ul.style.display = "none";

    Object.keys(lessonsDB[level]).forEach(lessonKey => {
      const lessonLi = document.createElement("li");
      lessonLi.textContent = lessonsDB[level][lessonKey].title;
      lessonLi.style.cursor = "pointer";
      lessonLi.classList.add("lesson-item");

      if (finished[level] && finished[level].includes(lessonKey)) {
        lessonLi.classList.add("completed");
      }

      lessonLi.addEventListener("click", () => {
        startLesson(level, lessonKey);

        if (currentLessonElement) {
          currentLessonElement.classList.remove("active");
        }
        lessonLi.classList.add("active");
        currentLessonElement = lessonLi;

        setTimeout(() => {
          document.getElementById("page3").scrollIntoView({ behavior: "smooth", block: "start" });
        }, 300);
      });

      ul.appendChild(lessonLi);
    });

    li.appendChild(ul);
    menu.appendChild(li);

    btn.addEventListener("click", () => {
      const isShown = ul.style.display === "block";
      document.querySelectorAll(".submenu").forEach(sub => sub.style.display = "none");
      ul.style.display = isShown ? "none" : "block";
    });
  });

  const favoritesBtn = document.createElement("li");
  favoritesBtn.classList.add("menu__nav-item");
  favoritesBtn.innerHTML = `<button id="favoritesDictionaryBtn" class="level-btn">Избранные слова</button>`;
  menu.appendChild(favoritesBtn);
  document.getElementById("favoritesDictionaryBtn").addEventListener("click", startDictionaryLesson);

  const customDictLi = document.createElement("li");
  customDictLi.classList.add("menu__nav-item");
  const customDictBtn = document.createElement("button");
  customDictBtn.textContent = "Мой словарь";
  customDictBtn.classList.add("level-btn");
  customDictLi.appendChild(customDictBtn);

  const customDictSubmenu = document.createElement("ul");
  customDictSubmenu.classList.add("submenu");
  customDictSubmenu.style.display = "none";

  const customLessons = getCustomDictionaryLessons();
  if (customLessons.length === 0) {
    const emptyLi = document.createElement("li");
    emptyLi.textContent = "Пока пусто";
    customDictSubmenu.appendChild(emptyLi);
  } else {
    customLessons.forEach(lesson => {
      const item = document.createElement("li");
      item.style.cursor = "pointer";
      item.textContent = `${lesson.title} — ${lesson.date}`;
      item.onclick = () => startCustomLesson(lesson.id);
      customDictSubmenu.appendChild(item);
    });
  }

  customDictLi.appendChild(customDictSubmenu);
  menu.appendChild(customDictLi);
  customDictBtn.addEventListener("click", () => {
    const isShown = customDictSubmenu.style.display === "block";
    document.querySelectorAll(".submenu").forEach(sub => sub.style.display = "none");
    customDictSubmenu.style.display = isShown ? "none" : "block";
  });
}
/* === Настройки (единая версия) === */
function addSettingsMenu() {
  const menu = document.getElementById("menuDropdown");

  const settingsLi = document.createElement("li");
  settingsLi.classList.add("menu__nav-item");

  const settingsBtn = document.createElement("button");
  settingsBtn.textContent = "⚙ Настройки";
  settingsBtn.classList.add("level-btn");
  settingsLi.appendChild(settingsBtn);

  const settingsWindow = document.createElement("div");
  settingsWindow.id = "settingsWindow";
  settingsWindow.style.display = "none";
  settingsWindow.style.position = "relative";
  settingsWindow.style.zIndex = "10";
  settingsWindow.style.padding = "10px";
  settingsWindow.style.marginTop = "5px";
  settingsWindow.style.backgroundColor = "#3a3a3a";
  settingsWindow.style.borderRadius = "5px";

  const settingsSubmenu = document.createElement("ul");
  settingsSubmenu.style.listStyle = "none";
  settingsSubmenu.style.margin = "0";
  settingsSubmenu.style.padding = "0";

  const examplesLi = document.createElement("li");
  const resetBtn = document.createElement("button");
  const syncResetButtonLabel = () => {
    resetBtn.textContent = pullExamplesFromJSON
      ? "Сброс примеров"
      : "Вернуть примеры";
  };
  syncResetButtonLabel();
  resetBtn.style.display = "block";
  resetBtn.style.width = "100%";
  resetBtn.style.marginBottom = "5px";
  resetBtn.onclick = () => {
    pullExamplesFromJSON = !pullExamplesFromJSON;
    savePullExamplesFlag(pullExamplesFromJSON);
    syncResetButtonLabel();
    if (!pullExamplesFromJSON) {
      examples = words.map(() => "");
      alert("Примеры отключены: в уроках будут пустые примеры.");
    } else {
      alert("Примеры снова включены и будут браться из JSON.");
    }
  };
  examplesLi.appendChild(resetBtn);
  settingsSubmenu.appendChild(examplesLi);

  const themesLi = document.createElement("li");
  const goToThemesBtn = document.createElement("button");

/* === Запуск урока из JSON === */
function startLesson(level, lessonKey) {
  const lesson = lessonsDB[level][lessonKey];
  if (!lesson) return;
  const baseWords = lesson.english || lesson.french || [];
  const fallbackTranslations = lesson.translated || lesson.english || lesson.french || [];

  currentLesson = { level, lessonKey };
  words = baseWords;
  transcriptions = lesson.transcriptions || [];
  translations = fallbackTranslations;
  examples = pullExamplesFromJSON ? (lesson.example || []) : words.map(() => "");
  currentPhase = 3;
  currentIndex = 0;
  wrongQueue = [];
  startPhase(currentPhase);
  saveLearningProgress();
  document.getElementById("menuDropdown").classList.remove("show");
}

/* === Запуск урока из словаря === */
function startDictionaryLesson() {
  const dict = getMyDictionary();
  if (dict.length === 0) { alert("Ваш словарь пуст."); return; }
let foundWords = [], foundTrans = [], foundTransl = [], foundExamples = [];
  for (const word of dict) {
    let found = false;
    for (const levelKey in lessonsDB) {
      for (const lessonKey in lessonsDB[levelKey]) {
        const lesson = lessonsDB[levelKey][lessonKey];
        const lessonWords = lesson.english || lesson.french || [];
        const idx = lessonWords.indexOf(word);
        if (idx !== -1) {
          foundWords.push(lessonWords[idx]);
          foundTrans.push(lesson.transcriptions[idx] || "");
          const lessonTranslations = lesson.translated || lesson.english || lesson.french || [];
          foundTransl.push(lessonTranslations[idx] || "(перевод)");
          foundExamples.push(lesson.example ? lesson.example[idx] : "");
          found = true;
          break;
        }
      }
      if (found) break;
    }
    if (!found) {
      foundWords.push(word);
      foundTrans.push("");
      foundTransl.push("(не найдено)");
      foundExamples.push("");
    }
  }

  words = foundWords;
  transcriptions = foundTrans;
  translations = foundTransl;
  examples = foundExamples;
  currentPhase = 3;
  currentIndex = 0;
  wrongQueue = [];
  hideAllPages();
  startPhase(currentPhase);
  saveLearningProgress();
  document.getElementById("menuDropdown").classList.remove("show");
}
function createCustomDictionaryLesson() {
  const now = new Date();
  const date = now.toLocaleDateString("ru-RU");
  const title = words[0] || "Новый список";
  const customLessons = getCustomDictionaryLessons();
  const newLesson = {
    id: `${Date.now()}`,
    title,
    date,
    words: [...words],
    transcriptions: [...transcriptions],
    translations: [...translations],
    examples: [...examples]
  };
  customLessons.unshift(newLesson);
  saveCustomDictionaryLessons(customLessons);
}

function startCustomLesson(lessonId) {
  const customLessons = getCustomDictionaryLessons();
  const lesson = customLessons.find(item => item.id === lessonId);
  if (!lesson) {
    alert("Не удалось открыть выбранный урок.");
    return;
  }

  currentLesson = null;
  words = lesson.words || [];
  transcriptions = lesson.transcriptions || words.map(() => "");
  translations = lesson.translations || words.map(() => "");
  examples = lesson.examples || words.map(() => "");
  currentPhase = 3;
  currentIndex = 0;
  wrongQueue = [];
  hideAllPages();
  startPhase(currentPhase);
  saveLearningProgress();
  document.getElementById("menuDropdown").classList.remove("show");
}
/* === Самостоятельный ввод слов === */
function goToTranscription() {
  const rawWords = document.getElementById("englishWords").value.trim();
  if (!rawWords) { alert("Введите хотя бы одно слово"); return; }
  words = rawWords.split("\n").map(s => s.trim()).filter(s => s);
  transcriptions = words.map(() => "");
  translations = words.map(() => "");
  examples = words.map(() => "");
  hideAllPages();
  document.getElementById("page1_5").classList.remove("hidden");
  updateHistoryStage("page1_5");
  saveLearningProgress();
}

function skipTranscription() {
  transcriptions = words.map(() => "");
  goToTranslations();
}

function goToTranslations() {
  const rawTrans = document.getElementById("englishTranscription").value.trim();
  if (rawTrans) {
    transcriptions = rawTrans.split("\n").map(s => s.trim());
    if (transcriptions.length !== words.length) { alert("Количество транскрипций должно совпадать с количеством слов"); return; }
  } else transcriptions = words.map(() => "");
  hideAllPages();
  document.getElementById("page2").classList.remove("hidden");
  updateHistoryStage("page2");
  saveLearningProgress();
}

function startSelfLearning() {
  const rawTransl = document.getElementById("translatedWords").value.trim();
  if (!rawTransl) { alert("Введите переводы"); return; }
  translations = rawTransl.split("\n").map(s => s.trim());
  if (translations.length !== words.length) { alert("Количество переводов должно совпадать с количеством слов"); return; }
  examples = words.map(() => "");
  createCustomDictionaryLesson();
  currentPhase = 3;
currentIndex = 0;
  wrongQueue = [];
  hideAllPages();
  startPhase(currentPhase);
  saveLearningProgress();
}

/* === Управление страницами === */
function hideAllPages() {
  ["page0","page1_5","page2","page3","page4","page5","page6","finishPage"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.add("hidden");
  });
}

/* === Фазы === */
function startPhase(phase) {
  hideAllPages();
  currentPhase = phase;
  currentIndex = 0;
  wrongQueue = [];
  phaseQueue = words.map((_, i) => i);
  if (phase === 5) {
    phaseQueue = shuffleArray(phaseQueue);
  }
  updateProgress();
  const phaseToPage = { 3: "page3", 4: "page4", 5: "page5", 6: "page6" };
  if (phaseToPage[phase]) updateHistoryStage(phaseToPage[phase]);

  if (phase === 3) showNextCard(null);
  else if (phase === 4) showPhase2();
  else if (phase === 5) showPhase3();
  else if (phase === 6) startDictationPhase();
  saveLearningProgress();
}

/* === Прогресс (единая простая версия) === */
function updateProgress() {
  const total = Math.max(1, words.length);
  let done = Math.min(total, currentIndex);
  if (currentPhase >= 3 && currentPhase <= 5) {
    done = total - phaseQueue.length;
  } else if (currentPhase === 6) {
    done = total - dictationQueue.length;
  }
  const percent = Math.round((done / total) * 100);
  const bar = document.getElementById("progressBar");
  const text = document.getElementById("progressText");
  if (bar) {
    bar.style.width = percent + "%";
    bar.textContent = percent + "%";
  }
  if (text) text.textContent = `Прогресс: ${done}/${total}`;
}

/* === Фаза 3 (карточки) === */
function showNextCard(correct = true) {
  if (phaseQueue.length > 0 && correct !== null) {
    if (correct) phaseQueue.shift();
    else phaseQueue.push(phaseQueue.shift());
  }
  if (phaseQueue.length === 0) { goToNextPage(); return; }
  document.getElementById("page3").classList.remove("hidden");
  const i = phaseQueue[0];
  currentIndex = i;
  const word = words[i];
  document.getElementById("card").innerHTML =
    `<strong>${word}</strong> [${transcriptions[i] || ""}] — ${translations[i] || ""}
     <button id="speakBtn" class="icon-btn">🔊</button>
     <button id="addToDictionaryBtnDynamic" class="dictionary-btn">${isInDictionary(word) ? "★" : "☆"}</button>`;
  document.getElementById("cardExample").textContent = examples[i] || "";

  document.getElementById("speakBtn").onclick = () => speakWord(word);
  document.getElementById("addToDictionaryBtnDynamic").onclick = () => toggleDictionary(word, document.getElementById("addToDictionaryBtnDynamic"));

  updateProgress();
  saveLearningProgress();
}

/* === Фаза 4 === */
function showPhase2() {
  if (phaseQueue.length === 0) { goToNextPage(); return; }
  document.getElementById("page4").classList.remove("hidden");
  document.getElementById("answerSection").classList.add("hidden");
  const i = getCurrentIndex();
  const word = words[i] || "";
  document.getElementById("phase2-translation").innerHTML =
    `<strong>${word}</strong>
     <button id="addToDictionaryBtnPhase2" class="dictionary-btn">${isInDictionary(word) ? "★" : "☆"}</button>`;
  document.getElementById("phase2-example").textContent = examples[i] || "";
  const phase2DictionaryBtn = document.getElementById("addToDictionaryBtnPhase2");
  if (phase2DictionaryBtn) {
    phase2DictionaryBtn.onclick = () => toggleDictionary(word, phase2DictionaryBtn);
  }
}

function showAnswer() {
  const i = getCurrentIndex();
  const answerContainer = document.getElementById("answerSection");
  document.getElementById("phase2-answer").textContent = `${translations[i] || ""}`;
 answerContainer.classList.remove("hidden");

  let btn = document.getElementById("speakPhase4Btn");
  if (!btn) {
    btn = document.createElement("button");
    btn.id = "speakPhase4Btn";
    btn.textContent = "🔊";
    btn.className = "icon-btn";
    answerContainer.appendChild(btn);
  }
  btn.onclick = () => speakWord(words[i]);
}

function markAnswer(correct) {
  if (phaseQueue.length > 0) {
    if (correct) phaseQueue.shift();
    else phaseQueue.push(phaseQueue.shift());
  }
  nextIndex();
  showPhase2();
  saveLearningProgress();
}

/* === Фаза 5 === */
function showPhase3() {
  if (phaseQueue.length === 0) { goToNextPage(); return; }
  document.getElementById("page5").classList.remove("hidden");
  document.getElementById("answerSection3").classList.add("hidden");
  const i = getCurrentIndex();
  const word = words[i] || "";
  document.getElementById("phase3-original").innerHTML =
    `<strong>${translations[i] || ""}</strong>
     <button id="addToDictionaryBtnPhase3" class="dictionary-btn">${isInDictionary(word) ? "★" : "☆"}</button>`;
  document.getElementById("phase3-example").textContent = examples[i] || "";
  const phase3DictionaryBtn = document.getElementById("addToDictionaryBtnPhase3");
  if (phase3DictionaryBtn) {
    phase3DictionaryBtn.onclick = () => toggleDictionary(word, phase3DictionaryBtn);
  }
}

function showAnswer3() {
  const i = getCurrentIndex();
  const answerContainer = document.getElementById("answerSection3");
  document.getElementById("phase3-answer").textContent = `${words[i] || ""} [${transcriptions[i] || ""}]`;
 answerContainer.classList.remove("hidden");

  let btn = document.getElementById("speakPhase5Btn");
  if (!btn) {
    btn = document.createElement("button");
    btn.id = "speakPhase5Btn";
    btn.textContent = "🔊";
    btn.className = "icon-btn";
    answerContainer.appendChild(btn);
  }
  btn.onclick = () => speakWord(words[i]);
}

function markAnswer3(correct) {
  if (phaseQueue.length > 0) {
    if (correct) phaseQueue.shift();
    else phaseQueue.push(phaseQueue.shift());
  }
  nextIndex();
  showPhase3();
  saveLearningProgress();
}

/* === Общие функции для перехода по списку === */
function nextIndex() {
  currentIndex = getCurrentIndex();
  updateProgress();
}

function getCurrentIndex() {
  if (phaseQueue.length > 0) return phaseQueue[0];
  return Math.min(currentIndex, Math.max(0, words.length - 1));
}

/* === Переходы между фазами === */
function goToNextPage() {
  if (currentPhase === 3) startPhase(4);
  else if (currentPhase === 4) startPhase(5);
  else if (currentPhase === 5) startPhase(6);
  else finishLesson();
  saveLearningProgress();
}

function repeatPhase() {
  if (currentPhase > 3) startPhase(currentPhase - 1);
  else startPhase(3);
}

function finishLesson() {
  hideAllPages();
  document.getElementById("finishPage").classList.remove("hidden");
  if (currentLesson) saveFinishedLesson(currentLesson.level, currentLesson.lessonKey);
  generateLevelsMenu();
  updateHistoryStage("finishPage");
  clearLearningProgress();
}

function backToMenu() {
  hideAllPages();
  document.getElementById("page0").classList.remove("hidden");
  document.getElementById("menuDropdown").classList.add("show");
  updateHistoryStage("page0");
  saveLearningProgress();
}

/* ===== Исправленный блок: Диктант (Фаза 6) ===== */

/*
 Логика:
 - dictationQueue содержит индексы слов, которые нужно пройти
 - startDictationPhase формирует очередь и вызывает showNextDictationWord
 - checkDictation сравнивает ввод с правильным словом:
    - если верно: удаляет первый элемент очереди и идёт дальше
    - если неверно: показывает правильный ответ в поле и перемещает элемент в конец очереди;
      устанавливает dictationWaiting = true, чтобы кнопка "Следующее" стала активной
*/

function startDictationPhase() {
  dictationQueue = shuffleArray(words.map((_, i) => i));
  dictationWaiting = false;
  currentIndex = 0;
  updateProgress();
  saveLearningProgress();
  showNextDictationWord();
}

function showNextDictationWord() {
  if (!dictationQueue || dictationQueue.length === 0) {
    finishLesson();
    return;
  }

  // текущий индекс — первый в очереди
  currentIndex = dictationQueue[0];
  dictationWaiting = false;

  hideAllPages();
  const page = document.getElementById("page6");
  if (page) page.classList.remove("hidden");

  // показываем перевод и пример
  const word = words[currentIndex] || "";
  document.getElementById("dictation-translation").innerHTML =
    `<strong>${translations[currentIndex] || ""}</strong>
     <button id="addToDictionaryBtnDictation" class="dictionary-btn">${isInDictionary(word) ? "★" : "☆"}</button>`;
 document.getElementById("dictation-example").textContent = examples[currentIndex] || "";
  const dictationDictionaryBtn = document.getElementById("addToDictionaryBtnDictation");
  if (dictationDictionaryBtn) {
    dictationDictionaryBtn.onclick = () => toggleDictionary(word, dictationDictionaryBtn);
  }

  // подготавливаем поле ввода и фидбек
  const inputEl = document.getElementById("dictation-input");
  if (inputEl) {
    inputEl.value = "";
    inputEl.focus();
  }
  document.getElementById("dictation-feedback").textContent = "";

  // кнопки: включаем/отключаем
  const checkBtn = document.getElementById("dictationCheckBtn");
  const nextBtn = document.getElementById("dictationNextBtn");
  if (checkBtn) checkBtn.disabled = false;
  if (nextBtn) nextBtn.disabled = true;

  // кнопка озвучки (создаётся один раз и располагается на странице)
  let btn = document.getElementById("speakDictationBtn");
  if (!btn) {
    btn = document.createElement("button");
    btn.id = "speakDictationBtn";
    btn.textContent = "🔊";
    btn.className = "icon-btn";
    btn.style.marginLeft = "8px";
    page.appendChild(btn);
  }
  btn.onclick = () => speakWord(words[currentIndex]);
}

function checkDictation() {
  // если уже в ожидании следующего после ошибки — игнорируем
  if (dictationWaiting) return;

  const inputEl = document.getElementById("dictation-input");
  const feedbackEl = document.getElementById("dictation-feedback");
  const checkBtn = document.getElementById("dictationCheckBtn");
  const nextBtn = document.getElementById("dictationNextBtn");

  if (!inputEl || !feedbackEl) return;

  const userAnswer = (inputEl.value || "").trim();
  const correctWord = words[currentIndex] || "";

  if (!userAnswer) {
    feedbackEl.textContent = "Введите слово.";
    return;
  }

  if (userAnswer.toLowerCase() === correctWord.toLowerCase()) {
    // правильно — удаляем текущий элемент из очереди и переходим к следующему
    feedbackEl.textContent = "✅ Верно!";
    dictationQueue.shift();
    updateProgress();

    // кнопки: пока переход внутрь, отключаем чтобы избежать двойных нажатий
    if (checkBtn) checkBtn.disabled = true;
    if (nextBtn) nextBtn.disabled = true;

    setTimeout(showNextDictationWord, 500);

  } else {
    // неверно — показываем правильный ответ в поле ввода и перемещаем слово в конец очереди
    feedbackEl.textContent = "❌ Неверно. Слово будет повторено позже.";
    inputEl.value = correctWord;

    // переместить текущую (первую) запись в конец очереди
    dictationQueue.push(dictationQueue.shift());
    dictationWaiting = true;

    // Кнопки: блокируем проверку, активируем "Следующее"
    if (checkBtn) checkBtn.disabled = true;
    if (nextBtn) nextBtn.disabled = false;
  }
  saveLearningProgress();
}

function nextDictationAfterError() {
  if (!dictationWaiting) return;
  dictationWaiting = false;
  showNextDictationWord();
  saveLearningProgress();
}

/* === Горячие клавиши (Enter/Space) === */
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    if (!document.getElementById("page3").classList.contains("hidden")) showNextCard();
    else if (!document.getElementById("page4").classList.contains("hidden")) {
      if (document.getElementById("answerSection").classList.contains("hidden")) showAnswer();
      else markAnswer(true);
    } else if (!document.getElementById("page5").classList.contains("hidden")) {
      if (document.getElementById("answerSection3").classList.contains("hidden")) showAnswer3();
      else markAnswer3(true);
    } else if (!document.getElementById("page6").classList.contains("hidden")) checkDictation();
  }
  if (e.code === "Space") {
    if (!document.getElementById("page4").classList.contains("hidden")) showAnswer();
    if (!document.getElementById("page5").classList.contains("hidden")) showAnswer3();
  }
});
